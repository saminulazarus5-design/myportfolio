<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my portfolio</title>
    <link rel="stylesheet" href="samzy.css">

</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        margin-bottom: 1000px;
    }
    .bg-video {
    width: 100%;
    object-fit: cover;
    position: relative;
    height: 100vh;
}
.header{
    position: fixed;
    display: flex;
    justify-content: space-between;
    top: 0;
    left: 0;
    right: 0;
    height: 80px;
    background-color: rgb(58, 5, 5);
    z-index: 100;
    background: transparent;
    border: solid 1px gray;
    padding: 20px 50px;
    background:rgba(214, 182, 182, 0.5) ;
    border-radius: 0 0 25px 25px;
    overflow: hidden;
}
.tesx{
    z-index:2;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    margin-bottom: 20px;

}


/* Dark overlay for better text visibility */
.bg-video::before{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:auto;
    background:rgba(0,0,0,0.4);
    z-index:-1;
}

.tesx{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.tesx h1{
    font-size:4rem;
}
.right{
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
   gap: 25px;
}

.pa{
    margin-bottom: 25px;
}
.pa1{
    margin-bottom: 25px;
    color: black;
}

.down{
  z-index:2;
    position:absolute;
    top: 0;
    left: 0;
    margin-top: 30px;
    flex-wrap: nowrap;
    
    
}
.viw{
    background: transparent;
background-color: rgb(255, 255, 255,0.4);
color: black;
height: 40px;
width: 140px;
border-radius: 30px;
border: none;
margin-right: 20px;
}
.resm{
   background: transparent;
    height: 40px;
    width: 150px;
    border: solid 1px gray;
   
    
}
</style>
<body>
    <div>
        <div class="header">
          <div>
            <h2>Samzy</h2>
          </div>
          <div class="right">
                 <h3>Home</h3> 
                 <h3>About</h3> 
                <h3>Project</h3> 
                 <h3>Contact</h3> 
          </div>
        </div>
        <div>
            <video autoplay muted loop class="bg-video">
                <source src="videos/326725_medium.mp4" type="video/mp4">
                Your browser does not support the video tag.
    </video>
         <div class="tesx">
            <p class="pa">Hi, I'm</p>
            <h1 class="pa">Saminu Lazarus</h1>
            <p class="pa1">Front-End Developer</p>
            <p class="pa">I create beautiful, responsive websites with modern technologies.</p>
         </div>
           
           <div class="down">
            <button class="viw">View my work</button>
            <button class="resm">Download Resume</button>
         </div>
        </div>
    </div>
</body>
</html>
